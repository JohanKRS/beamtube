name: APK de registro (verificação do Android)

# Gera, sob demanda, o APK que prova ao Google que a chave das releases é nossa, para registrar o
# pacote app.beamtube na verificação de desenvolvedor do Android (Play Console > Verificação de
# desenvolvedor Android > Nomes de pacotes). Não publica nada: o APK sai só como artefato do run.
#
# Como usar: copiar o snippet que o Play Console mostra em "Upload APK", rodar este workflow
# (Actions > APK de registro > Run workflow) colando o snippet, baixar o artefato e enviá-lo no
# Play Console. O snippet entra só neste APK, em assets/adi-registration.properties; o repositório
# e as releases não mudam.
on:
  workflow_dispatch:
    inputs:
      snippet:
        description: Snippet do Play Console (conteúdo do adi-registration.properties)
        required: true
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # O mesmo certificado que o release.yml confere: a chave das releases desde o APK 0.1.0.
      CERT_SHA256: 886493669cd66096a4ddb811f751c1ba1ca82e0e8711cab36d063e6d1e92a108
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.DOORGLOW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o secret com a chave das releases (ver a seção Atualizações do PLANO.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/beamtube.keystore"
          echo "BEAMTUBE_KEYSTORE=$RUNNER_TEMP/beamtube.keystore" >> "$GITHUB_ENV"

      # O snippet é lido do evento, nunca colado no script nem numa variável de ambiente do passo:
      # o repositório é público, e o log mostraria os dois. Cada linha também é mascarada.
      - name: Arquivo de registro
        run: |
          SNIPPET=$(jq -r '.inputs.snippet' "$GITHUB_EVENT_PATH")
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$SNIPPET"
          if [ -z "$(printf '%s' "$SNIPPET" | tr -d '[:space:]')" ]; then
            echo "::error::O snippet está vazio."
            exit 1
          fi
          mkdir -p app/src/main/assets
          printf '%s\n' "$SNIPPET" > app/src/main/assets/adi-registration.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: >
          ./gradlew :app:assembleAppRelease
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          -Pkotlin.compiler.execution.strategy=in-process

      - name: Conferir a assinatura e o arquivo
        run: |
          apk=app/build/outputs/apk/app/release/app-app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -qi "$CERT_SHA256" certs.txt || { echo "::error::APK assinado com outra chave."; exit 1; }
          unzip -p "$apk" assets/adi-registration.properties > inside.txt
          cmp -s inside.txt app/src/main/assets/adi-registration.properties \
            || { echo "::error::O adi-registration.properties não está no APK como foi colado."; exit 1; }
          cp "$apk" beamtube-registro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: beamtube-registro
          path: beamtube-registro.apk
          retention-days: 1

[versions]
# AGP 8.13 + compileSdk 36: as versões mais novas do AndroidX (Compose 1.12, Navigation 2.10)
# já pedem AGP 9 e compileSdk 37, e o AGP 9 ainda não serve para os módulos do motor.
agp = "8.13.2"
kotlin = "2.3.21"
coroutines = "1.10.2"
composeBom = "2026.06.01"
tvMaterial = "1.1.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigation = "2.9.8"
media3 = "1.11.1"
coil = "3.4.0"
okhttp-engine = "3.12.13"
# A mesma versão do motor (SharedModules/constants.gradle).
retrofit-engine = "2.5.0"
zxing = "3.5.3"
# Vidro fosco (desfoque do que passa por baixo das barras). A 1.7.3 e a 2.x já pedem o Compose 1.12.
haze = "1.7.2"
profileinstaller = "1.4.1"
datastore = "1.2.1"
coreKtx = "1.17.0"
serialization = "1.10.0"
junit = "4.13.2"
robolectric = "4.16"
androidxTestCore = "1.6.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
okhttp-engine = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp-engine" }
retrofit-engine = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit-engine" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# O motor fixa o OkHttp 3, e o coil-network-okhttp pede o 4: as imagens usam um adaptador próprio
# sobre o OkHttp 3 (ui/ImageHttp.kt), com o núcleo de rede do Coil.
coil-network-core = { module = "io.coil-kt.coil3:coil-network-core", version.ref = "coil" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-rx2 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-rx2", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

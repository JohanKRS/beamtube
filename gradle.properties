org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Os módulos do motor foram escritos para o AGP 7 e usam os R e o BuildConfig das dependências.
android.nonTransitiveRClass=false
android.defaults.buildfeatures.buildconfig=true

# ---------------------------------------------------------------------------
# Identidade do app: Doorglow. Para trocar nome e ícone:
#   - nome: app.name abaixo e o banner da TV (python3 tools/make_tv_banner.py "Nome");
#   - ícone: app/src/main/res/drawable/ic_launcher_*.xml e values/launcher.xml (cores).
# Trocar o app.id depois de instalado faz o Android tratar como outro app
# (é preciso entrar na conta de novo).
# ---------------------------------------------------------------------------
app.name=Doorglow
app.id=app.doorglow

# ABIs incluídas no APK. Celulares e TVs são ARM; adicione x86_64 para testar num emulador.
app.abis=arm64-v8a,armeabi-v7a

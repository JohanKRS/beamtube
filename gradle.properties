org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Os módulos do motor foram escritos para o AGP 7 e usam os R e o BuildConfig das dependências.
android.nonTransitiveRClass=false
android.defaults.buildfeatures.buildconfig=true

# ---------------------------------------------------------------------------
# Identidade do app: BeamTube. Para trocar nome e ícone:
#   - nome: app.name abaixo, e NAME em tools/make_icons.py (o nome desenhado no banner da TV);
#   - ícone e banner: python3 tools/make_icons.py (gera os recursos das sete cores).
# Trocar o app.id faz o Android tratar como outro app: instala ao lado do antigo, e é preciso
# entrar na conta de novo.
# ---------------------------------------------------------------------------
app.name=BeamTube
app.id=app.beamtube

# Versão. A cada release: some 1 no versionCode e mude o versionName. Um merge no main com um
# versionName que ainda não tem release gera a release no GitHub (o Obtainium pega dali).
app.versionCode=25
app.versionName=1.0.1

# ABIs incluídas no APK. Celulares e TVs são ARM; adicione x86_64 para testar num emulador.
app.abis=arm64-v8a,armeabi-v7a
